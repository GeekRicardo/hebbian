[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
common = { package = "hebbian-common", path = "../common" }
model-gateway = { path = "../model-gateway" }
observability = { path = "../observability" }
opentelemetry = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
async-trait = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
tracing = "0.1"
chrono = "0.4"
thiserror = "1"
dirs = "5"
shlex = "1"
fs2 = "0.4"
crc32fast = "1"
sha2 = "0.10"
regex = "1"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
portable-pty = "0.9"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
