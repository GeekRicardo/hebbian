[package]
name = "model-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
