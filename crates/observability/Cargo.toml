[package]
name = "observability"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "std", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
dirs = "5"
