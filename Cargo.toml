# apps/gpui **不在这个 workspace 里**（它自带一个）。
# 原因：gpui-component 的 webview 依赖链把 webkit2gtk 精确钉在 =2.0.1，
# 而打过补丁的 tauri 那条链钉的是 =2.0.2——两个精确版本没法共存。
# 放在同一个 workspace 里，cargo 会为了凑出一个解把 tauri 降到 2.9.5，
# 于是 [patch] 里那份 fork 静默失效（cargo 只给一句 "patch was not used" 的 warning），
# desktop 就编不过了。拆成两个 workspace，两条依赖链各自解各自的，互不干扰。
# 代价：`cargo check --workspace` 覆盖不到 gpui，得单独 `cargo check -p hebbian-gpui`（在 apps/gpui 下跑）。
[workspace]
members = [
    "apps/desktop",
    "apps/native",
    "apps/cli",
    "apps/web-server",
    "apps/hebcore",
    "apps/eval",
    "crates/agent-core",
    "crates/core-rpc",
    "crates/surface-session",
    "crates/model-gateway",
    "crates/observability",
    "crates/common",
    "crates/protocol",
    "crates/channel-core",
    "crates/channels",
    "apps/channel-gateway",
]
resolver = "2"

# tauri fork：仅 patch webview/mod.rs 一处 ACL 判定，让内置浏览器自举页面
# (本机 localhost dev server) 的自定义命令 invoke 不被 2.11 的 `!is_local` 拦掉。
# 第三方远端站点仍按上游拦死，不放开攻击面。其余与官方 2.11.2 完全一致。
# 用 rev 锁死 commit 保证可复现；升级 tauri 时需在 fork 重打 patch 再更新 rev。
[patch.crates-io]
tauri = { git = "https://github.com/GeekRicardo/tauri-fork", rev = "71bbc3f7e0e1587d3fb8d5656ae468ceddc3c9af" }
