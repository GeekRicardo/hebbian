[workspace]
members = [
    "apps/desktop",
    "apps/cli",
    "apps/web-server",
    "crates/agent-core",
    "crates/model-gateway",
    "crates/observability",
    "crates/common",
    "crates/protocol",
    "crates/channel-core",
    "crates/channels",
    "apps/channel-gateway",
]
resolver = "2"

# tauri fork：仅 patch webview/mod.rs 一处 ACL 判定，让内置浏览器自举页面
# (本机 localhost dev server) 的自定义命令 invoke 不被 2.11 的 `!is_local` 拦掉。
# 第三方远端站点仍按上游拦死，不放开攻击面。其余与官方 2.11.2 完全一致。
[patch.crates-io]
tauri = { path = "../tauri-fork" }
