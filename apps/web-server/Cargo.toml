[package]
name = "hebbian-web-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hebweb"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
core-rpc = { path = "../../crates/core-rpc" }
surface-session = { path = "../../crates/surface-session" }
model-gateway = { path = "../../crates/model-gateway" }
observability = { path = "../../crates/observability" }
common = { package = "hebbian-common", path = "../../crates/common" }
protocol = { path = "../../crates/protocol" }

# Web server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
hyper = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
