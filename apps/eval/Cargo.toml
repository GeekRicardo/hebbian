[package]
name = "hebbian-eval"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "heb-eval"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
