[package]
name = "hebbian-gpui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hebbian-gpui"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
core-rpc = { path = "../../crates/core-rpc" }
surface-session = { path = "../../crates/surface-session" }
model-gateway = { path = "../../crates/model-gateway" }
observability = { path = "../../crates/observability" }
common = { package = "hebbian-common", path = "../../crates/common" }
protocol = { path = "../../crates/protocol" }

gpui = "0.2.2"
# webview feature：内置浏览器预览用。它拉的是 wry——
# 与原 Desktop 的预览面板同一条路子（预览本身就是个浏览器），
# 不是把整个界面又塞回 WebView 里。
gpui-component = { version = "0.5.1", features = ["webview"] }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
# 终端：alacritty_terminal 负责 ANSI 解析与屏幕网格，portable-pty 负责起 shell。
# 不自己解析 ANSI——颜色、光标移动、清屏这些手写必然出错，出错的终端比没有更糟。
alacritty_terminal = "0.25"
portable-pty = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
