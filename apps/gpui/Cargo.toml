[package]
name = "hebbian-gpui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hebbian-gpui"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
core-rpc = { path = "../../crates/core-rpc" }
surface-session = { path = "../../crates/surface-session" }
model-gateway = { path = "../../crates/model-gateway" }
observability = { path = "../../crates/observability" }
common = { package = "hebbian-common", path = "../../crates/common" }
protocol = { path = "../../crates/protocol" }

gpui = "0.2.2"
gpui-component = "0.5.1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
