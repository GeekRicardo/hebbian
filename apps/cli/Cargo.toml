[package]
name = "hebbian-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "heb"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
model-gateway = { path = "../../crates/model-gateway" }
observability = { path = "../../crates/observability" }
common = { package = "hebbian-common", path = "../../crates/common" }
surface-session = { path = "../../crates/surface-session" }
protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
